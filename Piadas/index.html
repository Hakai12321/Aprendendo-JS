<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piadas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  
  <div class="container py-5">
      <div id="areaMusica" class="d-none position-fixed bottom-0 end-0 m-3 p-2 bg-white rounded shadow" style="width: 200px;">
      <!-- Player invisível (1 pixel, transparente) -->
        <div style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none;">
          <div id="playerMusica"></div>
        </div>

        <label for="volume" class="form-label">Volume</label>
        <input type="range" class="form-range" id="volume" min="0" max="100" value="50">
    </div>
    <h1 class="text-center mb-4">Gerador de Piadas</h1>

    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <!-- Seleção de categoria -->
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <label for="selectCategoria" class="form-label">Categoria</label>
            <select id="selectCategoria" class="form-select mb-3">
              <option value="">Aleatória (qualquer categoria)</option>
              <!-- as demais options são criadas pelo JS -->
            </select>
            <button id="btnPiada" class="btn btn-primary w-100">Mostrar piada</button>
          </div>
        </div>

        <!-- Card da piada (começa escondido) -->
        
        <div id="cardPiada" class="card shadow-sm d-none">
          <img id="imgPiada" class="card-img-top" alt="Imagem da piada">
          <div class="card-body">
            <span id="badgeCategoria" class="badge text-bg-secondary mb-2"></span>
            <h5 id="tituloPiada" class="card-title"></h5>
            <p id="textoPiada" class="card-text" style="white-space: pre-line;"></p>
          </div>

        </div>

      </div>
    </div>
  </div>


  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="Main.js"></script>
</body>
</html>
