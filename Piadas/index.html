<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piadas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center mb-4">Gerador de Piadas</h1>

    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <!-- Seleção de categoria -->
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <label for="selectCategoria" class="form-label">Categoria</label>
            <select id="selectCategoria" class="form-select mb-3">
              <option value="">Aleatória (qualquer categoria)</option>
              <!-- as demais options são criadas pelo JS -->
            </select>
            <button id="btnPiada" class="btn btn-primary w-100">Mostrar piada</button>
          </div>
        </div>

        <!-- Card da piada (começa escondido) -->
        <div id="cardPiada" class="card shadow-sm d-none">
          <img id="imgPiada" class="card-img-top" alt="Imagem da piada">
          <div class="card-body">
            <span id="badgeCategoria" class="badge text-bg-secondary mb-2"></span>
            <h5 id="tituloPiada" class="card-title"></h5>
            <p id="textoPiada" class="card-text"></p>
          </div>
          <iframe id="playerMusica" class="d-none" width="300" height="170" allow="autoplay" src=""></iframe>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="Main.js"></script>
</body>
</html>
